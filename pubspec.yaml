name: DragonTrack
description: "Track dragon fruit post flowering counts across your farm, offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.14.1
  receive_sharing_intent: ^1.8.1

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Dates / formatting
  intl: ^0.20.3

  # Charts for statistics dashboard
  fl_chart: ^1.2.0

  # Photos
  image_picker: ^1.1.2

  # Export
  csv: ^8.0.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^12.0.2
  excel: ^4.0.6

  # Unique IDs
  uuid: ^4.4.0

  # Simple key/value settings storage
  shared_preferences: ^2.2.3

  # Farm Sharing: portable .salsfarm package (zip container), and picking
  # a file from the device to import
  archive: ^3.6.1
  file_picker: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tree_empty.png
    - assets/icons/tree_flowering.png
    - assets/icons/tree_fruiting.png
    - assets/icons/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"    